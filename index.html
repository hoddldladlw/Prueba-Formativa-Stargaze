<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stargaze</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="nav-left">
            <img src="IMG/estrellas.png" alt="Stargaze Logo" class="logo">
            <h1>Stargaze</h1>
            <img src="IMG/estrellas.png" alt="Stargaze Logo" class="logo">
        </div>

        <nav class="nav-links">
            <a href="#">Planetas</a>
            <a href="#">Estrellas</a>
            <a href="#">Constelaciones</a>
            <a href="#">Estrellas Fugaces</a>
    </nav>

    <div class ="nav-search">
        <input type="text" id="searchInput" placeholder="Buscar">
        <button id="BotonDeBusqueda">
        <img src="IMG/buscar.png" alt="Stargaze Logo" class="logo">
        </button>
        </div>
        
        <div class="nav-icons">
            </button><img src="IMG/info.png" alt="Usuario" class="icon"></button>
            </button><img src="IMG/email.png" alt="Favoritos" class="icon"></button>
            </button><img src="IMG/telefono.png" alt="Carrito" class="icon"></button>
            </div>

            <main class="main-container">
                <section class="feed">
                    <article class="post-card"
                    <div class="post-header">
                        <img src="IMG/mundo.png" alt="Avatar" class="user-avatar">
                        <div class="user-info">
                            <h3>Estrellados </h3>
                            <p> Hace 6 minutos</p>
                        </div>
                    </div>
                </section>

    </header> 
</body>
</html>
